<title>MedFind</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap">
<style>
/* ── TOKENS ── */
:root{
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --card2:#F0F2F8;
  --sh:0 2px 12px rgba(80,100,160,.08);
  --sh-md:0 6px 24px rgba(80,100,160,.10);
  --sh-lg:0 12px 40px rgba(80,100,160,.12);
  --text:#1A2D5A;--text2:#6B7A9B;--text3:#9AA5BC;
  --accent:#4A80E8;--accentL:#E8F0FF;
  --orange:#FF8C42;--pink:#FF6B9D;--grn:#22C55E;
  --r-xl:22px;--r-lg:18px;--r-md:14px;--r-sm:10px;--r-full:999px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141820;
  --card:#1E2230;--card2:#232840;
  --sh:0 4px 20px rgba(0,0,0,.30);--sh-md:0 8px 32px rgba(0,0,0,.35);
  --sh-lg:0 16px 48px rgba(0,0,0,.45);
  --text:#E8F0FF;--text2:#8B9BBE;--text3:#4A5A7B;
  --accentL:rgba(74,128,232,.15);
}}
:root[data-theme="dark"]{
  --bg:#141820;
  --card:#1E2230;--card2:#232840;
  --sh:0 4px 20px rgba(0,0,0,.30);--sh-md:0 8px 32px rgba(0,0,0,.35);
  --sh-lg:0 16px 48px rgba(0,0,0,.45);
  --text:#E8F0FF;--text2:#8B9BBE;--text3:#4A5A7B;
  --accentL:rgba(74,128,232,.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);}
body{font-family:'Poppins','Sarabun',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:20px 16px;min-height:100vh;}
#root{display:flex;justify-content:center;width:100%;}

/* ── PHONE ── */
.phone{width:390px;max-width:100%;min-height:840px;
  background:var(--bg);border-radius:46px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.5),var(--sh-lg),
    inset 0 1px 0 rgba(255,255,255,.7);}

/* ── STATUS BAR ── */
.sbar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px 6px;font-size:.63rem;font-weight:700;color:var(--text);
  flex-shrink:0;letter-spacing:.02em;}
.sbar-r{display:flex;align-items:center;gap:5px;}
.sbar-r svg{width:13px;height:13px;fill:var(--text);}

/* ── SCROLLABLE SCREEN ── */
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px;}
.scr::-webkit-scrollbar{display:none;}

/* ── HOME: TOP BAR ── */
.h-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 22px 6px;}
.h-menu{width:36px;height:36px;display:flex;flex-direction:column;
  justify-content:center;gap:5px;cursor:pointer;padding:4px;}
.h-menu span{display:block;height:2px;background:var(--text);border-radius:2px;}
.h-menu span:first-child{width:18px;}
.h-menu span:nth-child(2){width:26px;}
.h-menu span:last-child{width:22px;}
.h-signup{display:flex;align-items:center;gap:5px;
  background:linear-gradient(120deg,#4A80E8,#8B5CF6);
  border:none;border-radius:var(--r-full);padding:8px 15px;
  font-size:.7rem;font-weight:700;font-family:inherit;color:#fff;
  cursor:pointer;box-shadow:0 4px 14px rgba(74,128,232,.35);
  transition:opacity .15s,transform .1s;flex-shrink:0;}
.h-signup:active{opacity:.85;transform:scale(.97);}
.h-avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#4A80E8,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;cursor:pointer;box-shadow:var(--sh);}

/* ── HOME: HERO ── */
.h-hero{padding:6px 24px 20px;}
.h-title{font-size:1.55rem;font-weight:800;color:var(--text);
  line-height:1.25;letter-spacing:-.03em;}

/* ── HOME: CATEGORIES ── */
.h-cats{display:flex;align-items:center;gap:10px;
  padding:0 18px 22px;overflow-x:auto;}
.h-cats::-webkit-scrollbar{display:none;}
.h-cat{display:flex;flex-direction:column;align-items:center;gap:7px;
  flex-shrink:0;cursor:pointer;}
.h-cat-circle{width:62px;height:62px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;}
.h-cat-circle:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.h-cat-circle svg{width:30px;height:30px;}
.h-cat-lbl{font-size:.6rem;font-weight:600;color:var(--text2);text-align:center;max-width:62px;}

/* ── HOME: SEARCH ── */
.h-search{margin:0 22px 22px;
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh);
  display:flex;align-items:center;gap:10px;padding:13px 16px;}
.h-search svg{width:17px;height:17px;stroke:var(--text3);
  fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.h-search input{flex:1;border:none;background:transparent;outline:none;
  font-size:.87rem;font-family:inherit;color:var(--text);}
.h-search input::placeholder{color:var(--text3);}

/* ── HOME: CALENDAR ── */
.h-cal{padding:0 22px 22px;}
.h-cal-month{font-size:.92rem;font-weight:700;color:var(--text);margin-bottom:14px;}
.h-cal-week{display:flex;gap:6px;}
.h-cal-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;}
.h-cal-dname{font-size:.58rem;font-weight:600;color:var(--text3);letter-spacing:.05em;}
.h-cal-dnum{width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:700;color:var(--text2);
  transition:background .15s,color .15s;}
.h-cal-day.act .h-cal-dname{color:var(--accent);}
.h-cal-day.act .h-cal-dnum{background:var(--accent);color:#fff;
  box-shadow:0 4px 14px rgba(74,128,232,.35);}

/* ── HOME: FEATURED DOCTOR ── */
.h-feat{margin:0 22px 22px;background:var(--card);border-radius:var(--r-xl);
  box-shadow:var(--sh);padding:16px;}
.h-feat-inner{display:flex;align-items:center;gap:14px;}
.h-feat-info{flex:1;min-width:0;}
.h-feat-name{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:3px;}
.h-feat-spec{font-size:.72rem;color:var(--text2);margin-bottom:8px;}
.h-feat-avail{font-size:.7rem;font-weight:600;color:var(--orange);}
.h-feat-right{display:flex;flex-direction:column;align-items:center;gap:8px;}
.h-feat-av{width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;position:relative;flex-shrink:0;}
.h-feat-dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;
  border-radius:50%;background:var(--grn);border:2px solid var(--card);}
.h-feat-btn{background:var(--text);color:#fff;border:none;border-radius:var(--r-full);
  padding:7px 14px;font-size:.68rem;font-weight:700;font-family:inherit;
  cursor:pointer;white-space:nowrap;}

/* ── SECTION HEADER ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;margin-bottom:14px;}
.sec-ttl{font-size:.88rem;font-weight:700;color:var(--text);}
.sec-see{font-size:.73rem;font-weight:600;color:var(--accent);cursor:pointer;
  background:none;border:none;font-family:inherit;}

/* ── HOME: TOP RATED (horizontal scroll) ── */
.h-rated{display:flex;gap:12px;padding:0 22px 22px;overflow-x:auto;}
.h-rated::-webkit-scrollbar{display:none;}
.h-doc-card{flex-shrink:0;width:140px;background:var(--card);
  border-radius:var(--r-xl);box-shadow:var(--sh);padding:14px 12px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;align-items:center;}
.h-doc-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.h-doc-av{width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;margin-bottom:9px;position:relative;}
.h-doc-avdot{position:absolute;bottom:2px;right:2px;width:9px;height:9px;
  border-radius:50%;background:var(--grn);border:2px solid var(--card);}
.h-doc-nm{font-size:.75rem;font-weight:700;color:var(--text);text-align:center;
  line-height:1.3;margin-bottom:3px;}
.h-doc-sp{font-size:.62rem;color:var(--text3);text-align:center;margin-bottom:9px;}
.h-doc-appt{width:100%;padding:7px 0;border-radius:var(--r-full);
  border:1.5px solid var(--text);background:transparent;
  font-size:.65rem;font-weight:700;font-family:inherit;color:var(--text);
  cursor:pointer;transition:background .15s,color .15s;}
.h-doc-appt:hover{background:var(--text);color:#fff;}

/* ── LIST SCREEN ── */
.list-hdr{display:flex;align-items:center;justify-content:center;
  padding:10px 22px 16px;position:relative;}
.list-back{position:absolute;left:22px;width:36px;height:36px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.list-back svg{width:18px;height:18px;stroke:var(--text);fill:none;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.list-title{font-size:1rem;font-weight:700;color:var(--text);}
.list-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px 16px;}
.list-card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh);
  padding:18px 14px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .14s,box-shadow .14s;}
.list-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.list-av{width:70px;height:70px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:2.1rem;margin-bottom:10px;position:relative;}
.list-avdot{position:absolute;bottom:3px;right:3px;width:11px;height:11px;
  border-radius:50%;background:var(--grn);border:2.5px solid var(--card);}
.list-nm{font-size:.78rem;font-weight:700;color:var(--text);text-align:center;
  line-height:1.3;margin-bottom:4px;}
.list-sp{font-size:.65rem;color:var(--text3);text-align:center;margin-bottom:12px;}
.list-appt-btn{width:100%;padding:8px 0;border-radius:var(--r-full);
  border:1.5px solid var(--text2);background:transparent;
  font-size:.67rem;font-weight:600;font-family:inherit;color:var(--text2);
  cursor:pointer;transition:border-color .15s,background .15s,color .15s;}
.list-appt-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── DETAIL SCREEN ── */
.det-hdr{display:flex;align-items:center;justify-content:center;
  padding:10px 22px 18px;position:relative;}
.det-back{position:absolute;left:22px;width:36px;height:36px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.det-back svg{width:18px;height:18px;stroke:var(--text);fill:none;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.det-title{font-size:1rem;font-weight:700;color:var(--text);}
.det-doc-row{display:flex;align-items:center;gap:14px;
  margin:0 22px 18px;background:var(--card);border-radius:var(--r-xl);
  box-shadow:var(--sh);padding:16px;}
.det-doc-av{width:60px;height:60px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  position:relative;}
.det-doc-avdot{position:absolute;bottom:2px;right:2px;width:11px;height:11px;
  border-radius:50%;background:var(--grn);border:2.5px solid var(--card);}
.det-doc-info{flex:1;min-width:0;}
.det-doc-name{font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:4px;}
.det-doc-spec{font-size:.73rem;color:var(--text2);}
.det-stats{display:flex;gap:14px;margin:0 22px 20px;}
.det-stat{flex:1;background:var(--card);border-radius:var(--r-lg);
  box-shadow:var(--sh);padding:14px 12px;text-align:center;}
.det-stat-lbl{font-size:.65rem;color:var(--text3);font-weight:500;margin-bottom:6px;}
.det-stat-val{font-size:1.25rem;font-weight:800;}
.det-stat-val.orange{color:var(--orange);}
.det-stat-val.pink{color:var(--pink);}
.det-book-btn{margin:0 22px 22px;width:calc(100% - 44px);padding:16px;
  border-radius:var(--r-lg);border:none;
  background:var(--accent);color:#fff;
  font-size:.92rem;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 22px rgba(74,128,232,.38);
  transition:opacity .15s,transform .1s;}
.det-book-btn:active{opacity:.88;transform:scale(.98);}
.det-sec{margin:0 22px 22px;}
.det-sec-ttl{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:8px;}
.det-sec-body{font-size:.78rem;color:var(--text2);line-height:1.65;}
.det-sched{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh);
  padding:14px 16px;display:flex;align-items:center;gap:14px;}
.det-sched-badge{width:46px;flex-shrink:0;
  background:var(--orange);border-radius:var(--r-md);
  padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;}
.det-sched-dname{font-size:.55rem;font-weight:700;color:rgba(255,255,255,.8);
  letter-spacing:.06em;}
.det-sched-dnum{font-size:1.15rem;font-weight:800;color:#fff;line-height:1;}
.det-sched-info{flex:1;min-width:0;}
.det-sched-spec{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:3px;}
.det-sched-time{font-size:.72rem;color:var(--text2);}
.det-sched-actions{display:flex;gap:8px;flex-shrink:0;}
.det-sched-ic{width:34px;height:34px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.det-sched-ic.call{background:#E8F8F0;}
.det-sched-ic.vid{background:#EEF0FF;}
.det-sched-ic svg{width:16px;height:16px;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.det-sched-ic.call svg{stroke:#22C55E;}
.det-sched-ic.vid svg{stroke:var(--accent);}

/* ── BOTTOM NAV ── */
.bnav{position:absolute;bottom:0;left:0;right:0;
  background:var(--card);border-radius:0 0 46px 46px;
  box-shadow:0 -4px 24px rgba(100,120,200,.10);
  padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));}
.bnav-inner{display:flex;align-items:center;justify-content:space-around;}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;padding:4px 10px;font-family:inherit;
  position:relative;}
.bni svg{width:22px;height:22px;stroke:var(--text3);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .15s;}
.bni-lbl{font-size:.56rem;font-weight:600;color:var(--text3);transition:color .15s;}
.bni.act svg{stroke:var(--accent);}
.bni.act .bni-lbl{color:var(--accent);}
.bni-badge{position:absolute;top:2px;right:8px;
  width:16px;height:16px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:.5rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;}
.bni-fab{width:46px;height:46px;border-radius:50%;
  background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(74,128,232,.42);
  transition:transform .15s,opacity .15s;margin-top:-8px;}
.bni-fab:active{transform:scale(.93);}
.bni-fab svg{width:22px;height:22px;stroke:#fff;fill:none;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* ── AUTH ── */
.auth-scr{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;}
.auth-scr::-webkit-scrollbar{display:none;}
.auth-hero{padding:36px 28px 28px;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(155deg,#D8E8FF 0%,#E2E4FF 50%,#EAD8FF 100%);
  position:relative;overflow:hidden;}
.auth-hero::before{content:"";position:absolute;top:-50px;right:-50px;
  width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.3);}
.auth-hero::after{content:"";position:absolute;bottom:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;background:rgba(160,130,255,.2);}
.auth-logo{width:64px;height:64px;border-radius:20px;
  background:linear-gradient(135deg,#4A80E8,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(74,128,232,.4);margin-bottom:13px;
  position:relative;z-index:1;}
.auth-logo svg{width:34px;height:34px;fill:none;stroke:#fff;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.auth-brand{font-size:1.55rem;font-weight:800;color:var(--text);
  letter-spacing:-.03em;margin-bottom:4px;position:relative;z-index:1;}
.auth-brand span{color:var(--accent);}
.auth-tagline{font-size:.77rem;color:var(--text2);font-weight:500;
  text-align:center;position:relative;z-index:1;}
.auth-body{padding:22px 22px 28px;display:flex;flex-direction:column;gap:14px;}
.auth-title{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.02em;}
.auth-sub{font-size:.76rem;color:var(--text3);}
.auth-field{display:flex;flex-direction:column;gap:5px;}
.auth-field label{font-size:.71rem;font-weight:600;color:var(--text2);}
.auth-iw{display:flex;align-items:center;
  background:var(--card2);border:1.5px solid transparent;border-radius:var(--r-md);
  box-shadow:var(--sh);overflow:hidden;transition:border-color .15s;}
.auth-iw:focus-within{border-color:var(--accent);}
.auth-ii{padding:0 11px;display:flex;align-items:center;flex-shrink:0;}
.auth-ii svg{width:16px;height:16px;stroke:var(--text3);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.auth-inp{flex:1;border:none;background:transparent;outline:none;
  font-size:.86rem;font-family:inherit;color:var(--text);padding:12px 0;}
.auth-inp::placeholder{color:var(--text3);}
.auth-eye{padding:0 11px;background:none;border:none;cursor:pointer;
  display:flex;align-items:center;color:var(--text3);}
.auth-eye svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.auth-err{font-size:.72rem;color:#EF4444;padding:8px 11px;
  border-radius:var(--r-md);background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.18);}
.auth-btn{width:100%;padding:14px;border-radius:var(--r-md);border:none;
  background:linear-gradient(120deg,#4A80E8,#8B5CF6);color:#fff;
  font-size:.88rem;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 22px rgba(74,128,232,.38);
  transition:opacity .15s,transform .1s;}
.auth-btn:active{opacity:.88;transform:scale(.98);}
.auth-div{display:flex;align-items:center;gap:10px;}
.auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:#E8EAFF;}
.auth-div span{font-size:.69rem;color:var(--text3);white-space:nowrap;}
.auth-social{display:flex;gap:10px;}
.auth-soc{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 8px;border-radius:var(--r-md);
  border:1.5px solid #E8EAFF;background:var(--card);
  cursor:pointer;font-size:.73rem;font-weight:600;font-family:inherit;
  color:var(--text2);transition:border-color .15s;}
.auth-soc:hover{border-color:var(--accent);}
.auth-switch{text-align:center;font-size:.77rem;color:var(--text3);}
.auth-swlink{color:var(--accent);font-weight:700;cursor:pointer;
  background:none;border:none;font-family:inherit;font-size:inherit;
  padding:0;margin-left:3px;}
.auth-forgot{text-align:right;font-size:.71rem;color:var(--accent);
  font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;}

/* ── LANG TOGGLE ── */
.lang-toggle{display:flex;align-items:center;background:var(--card2);
  border-radius:var(--r-full);padding:3px;gap:2px;flex-shrink:0;}
.lang-btn{padding:4px 10px;border-radius:var(--r-full);border:none;
  font-size:.62rem;font-weight:700;font-family:inherit;cursor:pointer;
  background:transparent;color:var(--text3);transition:all .15s;letter-spacing:.02em;}
.lang-btn.act{background:var(--accent);color:#fff;
  box-shadow:0 2px 8px rgba(74,128,232,.35);}

/* ── FLOATING DR. PAW FAB ── */
@keyframes paw-wander{
  0%  {transform:translate(0px,0px)     rotate(-3deg);}
  20% {transform:translate(-24px,-22px) rotate(2deg);}
  40% {transform:translate(-10px,-36px) rotate(-2deg);}
  60% {transform:translate(12px,-20px)  rotate(3deg);}
  80% {transform:translate(18px,-6px)   rotate(-1deg);}
  100%{transform:translate(0px,0px)     rotate(-3deg);}
}
@keyframes paw-shadow-pulse{
  0%,100%{transform:scaleX(1);opacity:.18;}
  50%    {transform:scaleX(.65);opacity:.08;}
}
@keyframes paw-bubble-in{
  0%,15% {opacity:0;transform:scale(.7) translateY(8px);}
  28%,72%{opacity:1;transform:scale(1)  translateY(0);}
  85%,100%{opacity:0;transform:scale(.7) translateY(8px);}
}
@keyframes paw-ripple{
  0%  {transform:scale(1);opacity:.45;}
  100%{transform:scale(2.2);opacity:0;}
}
.paw-fab{
  position:absolute;right:16px;bottom:100px;
  z-index:20;cursor:pointer;
  animation:paw-wander 5.5s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}
.paw-fab:active{animation:none!important;transform:scale(.86);}
.paw-fab-av{
  position:relative;width:62px;height:62px;
  border-radius:50%;overflow:hidden;
  border:3px solid #fff;
  box-shadow:0 8px 28px rgba(74,128,232,.28),0 2px 10px rgba(0,0,0,.12);
}
.paw-fab-av img{width:100%;height:100%;object-fit:cover;object-position:center 15%;}
.paw-fab-dot{
  position:absolute;bottom:3px;right:3px;
  width:14px;height:14px;border-radius:50%;
  background:var(--grn);border:2.5px solid #fff;
}
.paw-fab-ripple{
  position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--accent);
  animation:paw-ripple 2.2s ease-out infinite;
}
.paw-fab-shadow{
  width:44px;height:10px;border-radius:50%;
  background:rgba(74,128,232,.18);
  margin:4px auto 0;
  animation:paw-shadow-pulse 5.5s ease-in-out infinite;
}
.paw-fab-bubble{
  position:absolute;bottom:74px;right:0;
  background:var(--card);
  border-radius:14px 14px 0 14px;
  padding:8px 12px;
  font-size:.68rem;font-weight:600;color:var(--text);
  white-space:nowrap;
  box-shadow:var(--sh-md);
  animation:paw-bubble-in 7s ease-in-out 0.8s infinite;
  opacity:0;pointer-events:none;
}
.paw-fab-bubble::after{
  content:"";position:absolute;bottom:-6px;right:16px;
  border-style:solid;border-width:6px 0 0 6px;
  border-color:var(--card) transparent transparent var(--card);
}

/* ── CHAT SCREEN ── */
.chat-scr{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.chat-hdr{display:flex;align-items:center;gap:10px;
  padding:12px 18px 10px;border-bottom:1px solid var(--card2);}
.chat-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:none;border-radius:50%;cursor:pointer;flex-shrink:0;}
.chat-back svg{width:16px;height:16px;fill:none;stroke:var(--text);stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;}
.chat-hdr-info{flex:1;}
.chat-hdr-name{font-size:.88rem;font-weight:700;color:var(--text);}
.chat-hdr-status{font-size:.65rem;color:var(--grn);font-weight:600;}
.chat-hdr-av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  box-shadow:var(--sh);}
.chat-hdr-av img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}

.chat-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;}
.chat-body::-webkit-scrollbar{display:none;}

/* mascot intro area */
.chat-mascot{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:8px 0 4px;}
.chat-mascot-img{width:110px;height:110px;border-radius:50%;overflow:hidden;
  box-shadow:0 8px 28px rgba(74,128,232,.18);
  border:3px solid var(--accentL);}
.chat-mascot-img img{width:100%;height:100%;object-fit:cover;object-position:center 15%;}
.chat-mascot-name{font-size:.78rem;font-weight:700;color:var(--text2);}

/* message bubbles */
.cmsg{display:flex;flex-direction:column;max-width:82%;}
.cmsg.ai{align-self:flex-start;}
.cmsg.user{align-self:flex-end;}
.cmsg-bubble{padding:10px 13px;border-radius:18px;font-size:.8rem;line-height:1.45;
  word-break:break-word;}
.cmsg.ai .cmsg-bubble{background:var(--card);box-shadow:var(--sh);
  color:var(--text);border-bottom-left-radius:4px;}
.cmsg.user .cmsg-bubble{background:linear-gradient(120deg,#4A80E8,#6B5CF6);
  color:#fff;border-bottom-right-radius:4px;}
.cmsg-time{font-size:.58rem;color:var(--text3);margin-top:3px;padding:0 4px;}
.cmsg.user .cmsg-time{text-align:right;}

/* suggestion chips */
.chat-sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px;}
.chat-sug{padding:7px 12px;border-radius:var(--r-full);
  border:1.5px solid var(--accent);background:var(--accentL);
  font-size:.7rem;font-weight:600;color:var(--accent);
  font-family:inherit;cursor:pointer;transition:all .15s;}
.chat-sug:active{background:var(--accent);color:#fff;}

/* input bar */
.chat-input-bar{display:flex;align-items:center;gap:8px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--card2);background:var(--bg);}
.chat-inp{flex:1;border:1.5px solid var(--card2);border-radius:var(--r-full);
  background:var(--card);padding:10px 16px;font-size:.82rem;
  font-family:inherit;color:var(--text);outline:none;
  transition:border-color .15s;}
.chat-inp:focus{border-color:var(--accent);}
.chat-inp::placeholder{color:var(--text3);}
.chat-send{width:38px;height:38px;border-radius:50%;border:none;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:transform .1s,opacity .15s;
  box-shadow:0 4px 12px rgba(74,128,232,.35);}
.chat-send:active{transform:scale(.92);opacity:.88;}
.chat-send svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;}
</style>

      const r=tx.chatReply;
      if(low.includes("find")||low.includes("near")||low.includes("หา")||low.includes("ใกล้")) return r.find;
      if(low.includes("doctor")||low.includes("หมอ")||low.includes("แพทย์")) return r.doctor;
      if(low.includes("appointment")||low.includes("book")||low.includes("จอง")||low.includes("นัด")) return r.appointment;
      if(low.includes("symptom")||low.includes("อาการ")) return r.symptom;
      if(low.includes("flu")||low.includes("ไข้หวัด")||low.includes("ไข้")) return r.flu;
      if(low.includes("pharmacy")||low.includes("เภสัช")||low.includes("ยา")) return r.pharmacy;
      return r.default;
    };
    const sendMsg=(text)=>{
      if(!text.trim()) return;
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const userMsg={role:"user",text,time:t};
      const aiMsg={role:"ai",text:getReply(text),time:t};
      setChatMsgs(prev=>[...prev,userMsg,aiMsg]);
      setChatInput("");
    };
    const showSugs=chatMsgs.length===0;
    return h("div",{className:"chat-scr"},
      h("div",{className:"chat-hdr"},
        h("button",{className:"chat-back",onClick:()=>{setTab("home");setScreen("home");}},
          h("svg",{viewBox:"0 0 24 24"},h("polyline",{points:"15 18 9 12 15 6"}))),
        h("div",{className:"chat-hdr-info"},
          h("div",{className:"chat-hdr-name"},"Dr. Paw"),
          h("div",{className:"chat-hdr-status"},"● Online")),
        h("div",{className:"chat-hdr-av"},h("img",{src:CAT_IMG,alt:"Dr. Paw"}))
      ),
      h("div",{className:"chat-body"},
        h("div",{className:"chat-mascot"},
          h("div",{className:"chat-mascot-img"},h("img",{src:CAT_IMG,alt:"Dr. Paw"})),
          h("div",{className:"chat-mascot-name"},tx.chatTitle)
        ),
        h("div",{className:"cmsg ai"},
          h("div",{className:"cmsg-bubble"},tx.chatGreet),
          h("div",{className:"cmsg-time"},now)
        ),
        ...chatMsgs.map((m,i)=>h("div",{key:i,className:"cmsg "+m.role},
          h("div",{className:"cmsg-bubble"},m.text),
          h("div",{className:"cmsg-time"},m.time)
        ))
      ),
      showSugs&&h("div",{className:"chat-sugs"},
        h("button",{className:"chat-sug",onClick:()=>sendMsg(tx.chatSug1)},tx.chatSug1),
        h("button",{className:"chat-sug",onClick:()=>sendMsg(tx.chatSug2)},tx.chatSug2),
        h("button",{className:"chat-sug",onClick:()=>sendMsg(tx.chatSug3)},tx.chatSug3)
      ),
      h("div",{className:"chat-input-bar"},
        h("input",{className:"chat-inp",type:"text",placeholder:tx.chatPlaceholder,
          value:chatInput,
          onChange:e=>setChatInput(e.target.value),
          onKeyDown:e=>{if(e.key==="Enter")sendMsg(chatInput);}}),
        h("button",{className:"chat-send",onClick:()=>sendMsg(chatInput)},
          h("svg",{viewBox:"0 0 24 24"},
            h("line",{x1:22,y1:2,x2:11,y2:13}),
            h("polygon",{points:"22 2 15 22 11 13 2 9 22 2"})))
      )
    );
  };

  /* ── AUTH GUARD ── */
  if(authScreen==="signin")
    return h("div",{className:"phone"},h(SBar,null),h(SignIn,null));
  if(authScreen==="signup")
    return h("div",{className:"phone"},h(SBar,null),h(SignUp,null));

  return h("div",{className:"phone"},
    h(SBar,null),
    screen==="home" ? h(HomeScr,null)
    :screen==="list" ? h(ListScr,null)
    :screen==="chat" ? h(ChatScr,null)
    :h(DetailScr,null),
    screen==="home" && h("div",{className:"paw-fab",
      onClick:()=>{setTab("chat");setScreen("chat");}},
      h("div",{className:"paw-fab-bubble"},
        lang==="th"?"สวัสดี! มีอะไรให้ช่วยไหมครับ 🐾":"Hi! Need help? 🐾"),
      h("div",{className:"paw-fab-av"},
        h("div",{className:"paw-fab-ripple"}),
        h("img",{src:CAT_IMG,alt:"Dr. Paw"}),
        h("div",{className:"paw-fab-dot"})
      ),
      h("div",{className:"paw-fab-shadow"})
    ),
    h(BNav,null)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
